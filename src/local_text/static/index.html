<!doctype html>
<html lang="en" data-profile="__PROFILE__">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>__PAGE_TITLE__</title>
    <link rel="stylesheet" href="/static/app.css?v=__STATIC_VERSION__">
    <script src="/static/app.js?v=__STATIC_VERSION__" defer></script>
  </head>
  <body>
    <div class="page-grain" aria-hidden="true"></div>
    <header class="masthead">
      <div class="brand-lockup">
        <span class="thread-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <div>
          <div class="eyebrow">Local text workspace</div>
          <div class="brand-line">
            <h1>__DISPLAY_NAME__</h1>
            __DEVELOPMENT_BADGE__
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="control-rail" aria-label="Cleanup controls">
        <label class="switch-control" for="cleanup-enabled">
          <input id="cleanup-enabled" type="checkbox" checked>
          <span class="switch-track" aria-hidden="true"><span></span></span>
          <span>Clean automatically</span>
        </label>
        <button
          id="toggle-original"
          class="panel-toggle"
          type="button"
          aria-controls="original-editor-wrap"
          aria-expanded="true"
        >Hide input</button>
      </section>

      <div class="workspace-shell">
        <nav class="utility-rail" aria-label="Workspace sections">
          <span class="utility-rail-item is-active" aria-current="page">
            <span class="utility-rail-index" aria-hidden="true">01</span>
            <span>Workspace</span>
          </span>
        </nav>

        <section class="workspace" aria-label="Text cleanup workspace">
          <article class="text-panel original-panel">
            <header class="panel-heading">
              <div class="panel-title">
                <span class="panel-number">01</span>
                <h2>Original</h2>
              </div>
              <span class="panel-note">Type, paste, or dictate here</span>
            </header>
            <div class="editor-wrap" id="original-editor-wrap">
              <textarea
                id="original-text"
                aria-label="Original source text"
                autocomplete="off"
                placeholder="Type, paste, or use compatible dictation…"
                spellcheck="false"
              ></textarea>
            </div>
            <footer class="panel-footer original-panel-footer">
              <span><strong id="original-count">0</strong> characters</span>
              <div class="panel-footer-actions">
                <button
                  id="run-cleanup"
                  class="button button-primary"
                  type="button"
                  aria-keyshortcuts="Meta+Enter Control+Enter"
                  title="Run cleanup (⌘↵)"
                >
                  <span aria-hidden="true">↻</span> Run cleanup
                </button>
                <button id="clear-text" class="button button-quiet" type="button">Clear</button>
              </div>
            </footer>
          </article>

          <div
            id="workspace-resizer"
            class="workspace-resizer"
            role="separator"
            tabindex="0"
            aria-label="Resize Original and Cleaned fields"
            aria-orientation="horizontal"
            aria-valuemin="45"
            aria-valuemax="80"
            aria-valuenow="65"
            aria-valuetext="Original 65 percent, Cleaned 35 percent"
          >
            <span aria-hidden="true"></span><i aria-hidden="true"></i><span aria-hidden="true"></span>
          </div>

          <article class="text-panel cleaned-panel">
            <header class="panel-heading">
              <div class="panel-title">
                <span class="panel-number">02</span>
                <h2>Cleaned</h2>
              </div>
              <div class="panel-prompt-control">
                <label for="active-prompt-selector">Prompt</label>
                <select
                  id="active-prompt-selector"
                  aria-label="Cleanup prompt version for this page session"
                ></select>
              </div>
            </header>
            <div class="editor-wrap">
              <textarea
                id="cleaned-text"
                aria-label="Cleaned outgoing text"
                autocomplete="off"
                placeholder="Cleaned text appears here."
                readonly
                spellcheck="true"
              ></textarea>
            </div>
            <footer class="panel-footer">
              <span><strong id="cleaned-count">0</strong> characters</span>
              <span id="model-label">Gemini</span>
            </footer>
          </article>
        </section>
      </div>

      <section class="outgoing-region" aria-label="Outgoing text state">
        <div class="outgoing-strip">
          <div class="outgoing-summary">
            <span class="outgoing-label">Outgoing</span>
            <div class="outgoing-selector" role="group" aria-label="Outgoing text source">
              <button id="select-cleaned" type="button" aria-pressed="false">Cleaned</button>
              <button id="select-original" type="button" aria-pressed="true">Original</button>
            </div>
            <strong id="outgoing-kind">Nothing yet</strong>
          </div>
          <div class="outgoing-statuses">
            <button id="cleanup-status" class="status-pill" data-state="unchanged" type="button" aria-haspopup="dialog" aria-controls="error-details-dialog" disabled>
              <span class="status-light" aria-hidden="true"></span>
              <span id="cleanup-status-text" role="status" aria-live="polite">Ready</span>
            </button>
            <button id="publication-state" class="publication-state" type="button" aria-haspopup="dialog" aria-controls="error-details-dialog" disabled>
              <span aria-hidden="true"></span>
              <span role="status" aria-live="polite">State ready</span>
            </button>
          </div>
        </div>
        <details id="cleanup-disclosure" class="cleanup-disclosure">
          <summary>
            <span class="cleanup-disclosure-label">Cleanup route</span>
            <strong id="cleanup-disclosure-summary">Loading configuration…</strong>
          </summary>
          <div class="cleanup-disclosure-detail">
            <ol id="cleanup-route-list" aria-label="Configured cleanup route order"></ol>
            <p id="cleanup-processing-disclosure"></p>
            <p id="cleanup-fallback-disclosure"></p>
            <p id="cleanup-corpus-disclosure"></p>
            <p id="cleanup-validation-detail" class="cleanup-validation-detail" hidden></p>
          </div>
        </details>
      </section>
    </main>

    <dialog id="error-details-dialog" class="error-details-dialog" aria-labelledby="error-details-title">
      <div class="error-sheet">
        <header class="error-sheet-header">
          <h2 id="error-details-title">Error details</h2>
          <button id="close-error-details" class="dialog-close" type="button" aria-label="Close error details">×</button>
        </header>
        <dl id="error-details-ledger"></dl>
        <button id="copy-error-details" class="button" type="button">Copy details</button>
      </div>
    </dialog>
  </body>
</html>
