[project]
name = "local-text"
version = "0.1.0"
description = "Local-first text application runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1,<1",
    "httpx>=0.28.1,<1",
    "uvicorn>=0.35.0,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1,<9",
    "ruff>=0.12.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_text"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
